# workflow-id: portfolio-spanish-pages-v4
# Vite base = /apps/spanish/ (correct for custom domain deazuadesign.com at site root).
# The /deazuadesign-portfolio/ segment only applies to *.github.io/deazuadesign-portfolio/ URLs.
#
# BEFORE THIS WORKS: deazuadesign-portfolio → Settings → Pages → Build and deployment
# → Source MUST be "GitHub Actions" (not "Deploy from a branch"). Otherwise
# configure-pages fails with exit code 1.
#
# Public Spanish repo: no secret needed. Private: SPANISH_REPO_TOKEN (read access).
#
# Only the build output is published: site/out (Next.js static export) plus apps/spanish.
name: Deploy GitHub Pages
on:
    push:
      branches: [main]
    workflow_dispatch:
    repository_dispatch:
      types: [spanish-app-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deazuadesign-portfolio
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Fetch Spanish app (git clone — avoids API "Not Found")
        env:
          PAT: ${{ secrets.SPANISH_REPO_TOKEN }}
        run: |
          set -euxo pipefail
          rm -rf spanish-app
          # Trim secret: a blank/whitespace-only secret would break x-access-token URLs
          TRIMMED="$(printf '%s' "$PAT" | tr -d ' \t\r\n')"
          if [ -n "$TRIMMED" ]; then
            git clone --depth 1 "https://x-access-token:${TRIMMED}@github.com/rlopezde-ops/el-camino-del-guerrero.git" spanish-app
          else
            git clone --depth 1 https://github.com/rlopezde-ops/el-camino-del-guerrero.git spanish-app
          fi
          test -f spanish-app/package.json
          test -f spanish-app/package-lock.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            spanish-app/package-lock.json
            site/package-lock.json

      - name: Install & build Spanish app
        working-directory: spanish-app
        env:
          VITE_PAGES_BASE: /apps/spanish/
        run: |
          set -euxo pipefail
          node --version
          npm --version
          npm ci
          npm run build
          cp dist/index.html dist/404.html
          test -f dist/index.html

      - name: Install & build portfolio site
        working-directory: site
        run: |
          set -euxo pipefail
          npm ci
          npm run build
          # assets/ also holds working files that must never be published
          rm -rf out/assets/claude-stuff out/assets/figma-files
          test ! -e out/assets/claude-stuff
          test -f out/index.html
          test -f out/leadership.html
          test -f out/assets/images/logo.png

      - name: Assemble site (portfolio + apps/spanish)
        run: |
          set -euxo pipefail
          mkdir -p _site
          cp -R site/out/. _site/
          mkdir -p _site/apps/spanish
          cp -r spanish-app/dist/. _site/apps/spanish/
          : > _site/.nojekyll
          test -f _site/index.html
          test -f _site/apps/spanish/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
